<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse lots | BidForge</title>
  <meta name="description" content="Search and filter live jewellery auctions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="nav" id="site-nav"></header>
<main class="page" id="main">
  <div class="container">
    <div class="page-head">
      <h1>Browse lots</h1>
      <p>Search by name or category, then filter by category, condition and price.</p>
    </div>
    <div class="tabs" role="tablist" aria-label="Lot status">
      <button class="tab" role="tab" id="tab-open" aria-selected="true">Open lots</button>
      <button class="tab" role="tab" id="tab-closed" aria-selected="false">Closed lots</button>
    </div>
    <div class="filter-bar">
    <form class="filters" id="filters" autocomplete="off">
      <div class="field"><label for="f-q">Search</label><input id="f-q" type="search" placeholder="Ring, pearl, necklace..."></div>
      <div class="field"><label for="f-category">Category</label><select id="f-category"><option value="">All categories</option></select></div>
      <div class="field"><label for="f-condition">Condition</label><select id="f-condition"><option value="">Any condition</option></select></div>
      <div class="field"><label for="f-sort">Sort by</label>
        <select id="f-sort">
          <option value="ending">Ending soonest</option>
          <option value="price-low">Price, low to high</option>
          <option value="price-high">Price, high to low</option>
          <option value="bids">Most bids</option>
          <option value="newest">Newest lots</option>
        </select></div>
    </form>
    <div class="filters--price">
      <div class="field"><label for="f-min">Lowest price</label><div class="input-prefix"><span>₹</span><input id="f-min" type="number" min="0" step="1000" placeholder="0"></div></div>
      <div class="field"><label for="f-max">Highest price</label><div class="input-prefix"><span>₹</span><input id="f-max" type="number" min="0" step="1000" placeholder="Any"></div></div>
      <div class="field"><label>&nbsp;</label><button class="btn btn--secondary" type="button" id="f-clear">Clear filters</button></div>
    </div>
    </div>
    <p class="result-count" id="result-count" aria-live="polite"></p>
    <div class="lots" id="lots"></div>
  </div>
</main>
<footer class="footer" id="site-footer"></footer>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/pages/browse.js"></script>
</body>
</html>
