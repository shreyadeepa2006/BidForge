<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>List an item | BidForge</title>
  <meta name="description" content="List a piece of jewellery for auction.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="nav" id="site-nav"></header>
<main class="page" id="main">
  <div class="container">
    <div class="page-head"><h1>List an item</h1><p>Describe your piece. In the next step you choose when its auction starts and ends.</p></div>
    <div class="two-col">
      <section class="panel">
        <form class="form form--two" id="item-form" novalidate>
          <div class="field full"><label for="ItemName">Item name</label><input id="ItemName" maxlength="100" placeholder="Solitaire diamond ring"></div>
          <div class="field"><label for="Category">Category</label><select id="Category"></select></div>
          <div class="field"><label for="Condition">Condition</label><select id="Condition"></select></div>
          <div class="field full"><label for="Description">Description (optional)</label><textarea id="Description" maxlength="300" placeholder="Weight, stones, wear, anything a bidder should know."></textarea><span class="hint" id="desc-count">0 of 300 characters</span></div>
          <div class="field full"><label for="StartingPrice">Starting price</label><div class="input-prefix"><span>₹</span><input id="StartingPrice" type="number" min="1" step="1" inputmode="numeric"></div></div>
          <div class="full"><button class="btn btn--primary" type="submit">Save and schedule auction</button></div>
        </form>
      </section>
      <aside aria-label="Preview">
        <p class="muted small">Preview of your lot card</p>
        <div id="preview" style="max-width:320px"></div>
      </aside>
    </div>
  </div>
</main>
<footer class="footer" id="site-footer"></footer>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/pages/list-item.js"></script>
</body>
</html>
