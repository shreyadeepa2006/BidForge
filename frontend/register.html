<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | BidForge</title>
  <meta name="description" content="Create a BidForge account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="nav" id="site-nav"></header>
<main class="page" id="main">
  <div class="container">
    <div class="auth auth--wide">
      <h1>Create your account</h1>
      <p class="muted">One account lets you bid on lots and sell your own pieces.</p>
      <form class="form form--two" id="register-form" novalidate>
        <div class="field full"><label for="FullName">Full name</label><input id="FullName" name="FullName" maxlength="100" autocomplete="name"></div>
        <div class="field"><label for="Email">Email</label><input id="Email" name="Email" type="email" maxlength="100" autocomplete="email"><span class="hint">You will log in with this. It must be unique.</span></div>
        <div class="field"><label for="PhoneNo">Phone number (optional)</label><input id="PhoneNo" name="PhoneNo" type="tel" maxlength="15" autocomplete="tel" placeholder="9876543210"></div>
        <div class="field full"><label for="Address">Shipping address (optional)</label><input id="Address" name="Address" maxlength="200" autocomplete="street-address"></div>
        <div class="field"><label for="Password">Password</label><input id="Password" name="Password" type="password" autocomplete="new-password"><div class="strength" aria-hidden="true"><i id="strength-bar"></i></div><span class="hint" id="strength-text">At least 8 characters, with a letter and a number.</span></div>
        <div class="field"><label for="Confirm">Confirm password</label><input id="Confirm" name="Confirm" type="password" autocomplete="new-password"></div>
        <div class="full"><button class="btn btn--primary" type="submit">Create account</button></div>
      </form>
      <p style="margin-top:16px">Already registered? <a href="login.html">Log in</a></p>
    </div>
  </div>
</main>
<footer class="footer" id="site-footer"></footer>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/pages/register.js"></script>
</body>
</html>
