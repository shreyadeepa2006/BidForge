<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | BidForge</title>
  <meta name="description" content="Log in to bid and sell.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="nav" id="site-nav"></header>
<main class="page" id="main">
  <div class="container">
    <div class="auth">
      <h1>Log in</h1>
      <p class="muted">Log in to bid on lots, sell your jewellery and manage your wallet.</p>
      <form class="form" id="login-form" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password"></div>
        <button class="btn btn--primary btn--block" type="submit">Log in</button>
      </form>
      <p style="margin-top:16px">New to BidForge? <a href="register.html">Create an account</a></p>
    </div>
  </div>
</main>
<footer class="footer" id="site-footer"></footer>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/components.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
